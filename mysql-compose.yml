version: '3.8'

services:
  mysql:
    container_name: mysql
    image: mysql:latest
    ports:
    - "3308:3306"
    environment:
      - MYSQL_DATABASE=dev
      - MYSQL_USER=sovon9
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql:rw

volumes:
  mysql_data: